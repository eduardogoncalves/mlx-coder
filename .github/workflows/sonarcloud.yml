name: SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set up Swift 6.3.1
        shell: bash
        run: |
          set -euo pipefail

          swiftly_pkg="$RUNNER_TEMP/swiftly.pkg"
          post_install_script="$RUNNER_TEMP/swiftly-post-install.sh"

          curl --fail --location --silent --show-error \
            https://download.swift.org/swiftly/darwin/swiftly.pkg \
            --output "$swiftly_pkg"
          installer -pkg "$swiftly_pkg" -target CurrentUserHomeDirectory

          export PATH="$HOME/.swiftly/bin:$PATH"

          swiftly init \
            --skip-install \
            --quiet-shell-followup \
            --assume-yes \
            --no-modify-profile

          rm -f "$post_install_script"
          swiftly install \
            --use \
            6.3.1 \
            --assume-yes \
            --post-install-file "$post_install_script"

          if [ -f "$post_install_script" ]; then
            bash "$post_install_script"
          fi

          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          swiftly use --print-location >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and collect coverage
        run: |
          swift test --enable-code-coverage 2>&1 || true
          xcrun llvm-cov export \
            .build/debug/mlx-coderPackageTests.xctest/Contents/MacOS/mlx-coderPackageTests \
            --instr-profile .build/debug/codecov/default.profdata \
            --format=lcov \
            --ignore-filename-regex="(.build|Tests)" \
            > coverage.lcov || true

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
